<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔진 테스트 픽스처</title>
<style>
/* ================= 문서 기본 스타일 (자유 수정 영역) ================= */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
:root{
  --ink:#0f172a; --sub:#64748b; --line:#e6eaf0; --accent:#2563eb;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8ebf0;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
  padding:28px 18px;}
.fig-stage{max-width:1240px;margin:0 auto;background:#fff;border-radius:16px;
  box-shadow:0 14px 44px rgba(20,30,60,.14);padding:36px 40px;}
/* 캔버스 안 도형·텍스트 스타일은 자유롭게 추가 */
.cls-pos{left:40px;top:300px;width:150px;height:50px;background:#fff;border:1px solid #cbd5e1;padding:10px;font-size:14px}
</style>
<style id="fig-editor-css">
/*__FIG_EDITOR_CSS__*/
</style>
</head>
<body>
<div class="fig-stage">

  <!-- ======== FIG:CONTENT START: 이 안을 작성한다 ======== -->
  <!-- 캔버스 밖 일반 HTML(제목 등)도 편집 모드에서 더블클릭으로 글자 수정 가능 -->

  
  <div class="fig-canvas" data-size="900x400">
    <div class="fig-node" id="a" style="left:40px;top:60px;width:180px;height:70px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:14px">A 박스</div>
    <div class="fig-node" id="b" style="left:600px;top:60px;width:180px;height:70px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:14px">B 박스</div>
    <div class="fig-node" id="c" style="left:320px;top:260px;width:180px;height:70px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:11px">작은 글자 11px</div>
    <div class="fig-node cls-pos" id="d">클래스 좌표 노드</div>
    <div class="fig-node" id="f" style="left:600px;top:260px;width:180px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:14px">높이 미지정 노드<br>두 줄짜리 내용</div>
    <div class="fig-edge" id="e-auto" data-from="a" data-to="f" data-color="#2563eb"></div>
    <div class="fig-edge" id="e-var" data-from="a" data-to="b" data-color="var(--accent)" data-label="var색 라벨"></div>
    <div class="fig-edge" id="e-hex" data-from="a" data-to="c" data-color="#0e7490" data-curve="0.2" data-label="hex 라벨"></div>
    <div class="fig-edge" id="e-missing" data-from="b" data-to="nope" data-color="#b45309"></div>
  </div>


  <!-- ======== FIG:CONTENT END ======== -->

</div>
<script>
/*__FIG_EDITOR_JS__*/
</script>
</body>
</html>
